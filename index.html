<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#143d2c">
    <link rel="stylesheet" href="src/styles/tokens.css">
    <link rel="stylesheet" href="src/styles/global.css">
    <script defer src="src/data/products.js"></script>
    <script defer src="src/data/korea-beta.js"></script>
    <script defer src="src/i18n/ko.js"></script>
    <script defer src="src/i18n/en.js"></script>
    <script defer src="src/i18n/ja.js"></script>
    <script defer src="src/i18n/es.js"></script>
    <script defer src="src/i18n/vi.js"></script>
    <script defer src="src/i18n/id.js"></script>
    <script defer src="src/i18n/th.js"></script>
    <script defer src="src/i18n/index.js"></script>
    <script defer src="src/app.js"></script>
    <title>OWNGROUND</title>
  </head>
  <body>
    <a class="skip-link" href="#main" data-i18n="accessibility.skipToContent"></a>
    <header class="site-header">
      <a class="wordmark" href="#main" aria-label="OWNGROUND">OWNGROUND</a>
      <nav class="site-nav" data-i18n-aria-label="accessibility.mainNavigation">
        <a href="#products" data-i18n="nav.products"></a>
        <a href="#philosophy" data-i18n="nav.about"></a>
        <a href="#contact" data-i18n="nav.contact"></a>
      </nav>
      <div class="language-switcher" data-language-control>
        <button class="locale-switch" type="button" data-language-toggle
          aria-haspopup="true" aria-expanded="false" aria-controls="language-menu"
          data-i18n-aria-label="accessibility.languageSelector" aria-label="언어 선택">
          <span data-language-current>KO</span>
        </button>
        <div class="locale-menu" id="language-menu" data-language-menu role="group"
          data-i18n-aria-label="accessibility.languageSelector" aria-label="언어 선택" hidden>
          <button type="button" data-language-option="ko" lang="ko">KO</button>
          <button type="button" data-language-option="en" lang="en">EN</button>
          <button type="button" data-language-option="ja" lang="ja">JA</button>
          <button type="button" data-language-option="es" lang="es">ES</button>
          <button type="button" data-language-option="vi" lang="vi">VI</button>
          <button type="button" data-language-option="id" lang="id">ID</button>
          <button type="button" data-language-option="th" lang="th">TH</button>
        </div>
      </div>
    </header>

    <main id="main">
      <section class="hero" aria-labelledby="hero-title">
        <p class="eyebrow">OWNGROUND</p>
        <h1 id="hero-title" data-i18n="hero.title"></h1>
        <p class="hero-copy" data-i18n="hero.description"></p>
      </section>

      <section class="section" id="products" aria-labelledby="products-title">
        <p class="section-label" data-i18n="products.label"></p>
        <h2 id="products-title" data-i18n="products.title"></h2>
        <div class="product-grid" id="product-grid"></div>
      </section>

      <section class="philosophy" id="philosophy" aria-labelledby="philosophy-title">
        <p class="section-label" data-i18n="philosophy.label"></p>
        <h2 id="philosophy-title" data-i18n="philosophy.title"></h2>
        <p data-i18n="philosophy.body"></p>
      </section>
    </main>

    <footer id="contact">
      <a class="wordmark" href="#main" aria-label="OWNGROUND">OWNGROUND</a>
      <p data-i18n="footer.contact"></p>
      <p data-i18n="footer.copyright"></p>
    </footer>
  </body>
</html>
